# Baut das Docker-Image des CMS (Payload) und legt es in der GitHub Container Registry ab.
# In mStudio wird der Container mit diesem Image gestartet bzw. neu erstellt.
name: CMS-Image bauen

on:
  push:
    branches: [main]
    paths: ['cms/**', '.github/workflows/cms-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name klein schreiben
        id: n
        run: echo "img=ghcr.io/${GITHUB_REPOSITORY,,}-cms" >> "$GITHUB_OUTPUT"
      - name: CMS-Image
        uses: docker/build-push-action@v6
        with:
          context: cms
          target: runner
          push: true
          tags: ${{ steps.n.outputs.img }}:latest,${{ steps.n.outputs.img }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Werkzeug-Image (Startinhalte)
        uses: docker/build-push-action@v6
        with:
          context: cms
          target: tools
          push: true
          tags: ${{ steps.n.outputs.img }}:tools
          cache-from: type=gha
