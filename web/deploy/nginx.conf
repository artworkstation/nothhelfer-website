# nginx-Konfiguration für den Website-Container (statische Astro-Seiten)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html/public;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Sicherheits-Header
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Gehashte Assets lange cachen
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location ~* \.(jpg|jpeg|png|webp|svg|woff2?)$ { expires 30d; }

  # Saubere URLs mit Slash am Ende
  location / { try_files $uri $uri/ $uri.html =404; }

  error_page 404 /404.html;
}
